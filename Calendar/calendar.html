<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="calendar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div id="login-gate" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 16px;">
    <p>Sign in to access the calendar</p>
    <button id="google-signin-btn" style="display: flex; align-items: center; gap: 10px; padding: 12px 24px; background: #fff; border: 1px solid #ddd; border-radius: 6px; cursor: pointer;">
      <i class="fa-brands fa-google"></i> Sign in with Google
    </button>
  </div>

  <div id="content" style="display: none;">
    <div class="container">
        <div class="header-tabs">
            <div class="tab active" data-view="calendar">Calendar</div>
            <div class="tab" data-view="reminders">Reminders</div>
        </div>

        <div id="calendar-view">
            <div class="calendar">
                <div class="month">
                    <i class="fas fa-angle-left prev"></i>
                    <div class="date"></div>
                    <i class="fas fa-angle-right next"></i>
                </div>
                <div class="weekdays">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                </div>
                <div class="days"></div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                    <button class="today-btn">Today</button>
                    <button id="saveBtn" onclick="saveToFirestore()" style="background: var(--primary-clr); color: #fff; border: none; padding: 6px 15px; border-radius: 20px; cursor: pointer;">Save</button>
                    <a href="../index.html" style="color: var(--primary-clr);"><i class="fa fa-home"></i></a>
                </div>
            </div>
            <div class="right">
                <div class="today-date">
                    <div class="event-day"></div>
                    <div class="event-date"></div>
                </div>
                <div class="events"></div>
            </div>
        </div>

        <div id="reminders-view" style="display: none;">
            <div class="reminders-list">
                <!-- Grouped reminders will be injected here -->
            </div>
        </div>
        <button class="add-event"><i class="fas fa-plus"></i></button>

        <div class="add-event-wrapper">
            <div class="add-event-header">
                <div class="title" style="font-weight: 700; font-size: 1.2rem;">New Event</div>
                <i class="fas fa-times close" style="cursor: pointer;"></i>
            </div>
            <div class="recur-mode-toggle">
                <button class="recur-mode-btn active" data-mode="single">Single day</button>
                <button class="recur-mode-btn" data-mode="recurring">Recurring</button>
            </div>
            <div class="add-event-body">
                <input type="text" placeholder="Event Name" class="event-name" />
                <div style="display: flex; gap: 10px;">
                    <input type="time" placeholder="From" class="event-time-from" style="flex: 1;"/>
                    <input type="time" placeholder="To" class="event-time-to" style="flex: 1;"/>
                </div>
                <label class="discretionary-option">
                    <input type="checkbox" id="event-discretionary" />
                    Discretionary event
                </label>
                <div id="recurring-fields" style="display:none;">
                    <div style="display:flex;gap:8px;margin-top:10px;">
                        <input type="date" id="recur-start" style="flex:1;" />
                        <input type="date" id="recur-end" style="flex:1;" />
                    </div>
                    <label class="recurrence-frequency-label" for="recur-frequency">Repeat</label>
                    <select id="recur-frequency" class="recurrence-frequency">
                        <option value="weekly" selected>Weekly</option>
                        <option value="biweekly">Every 2 weeks</option>
                        <option value="monthly">Monthly (every 4 weeks)</option>
                    </select>
                    <div class="weekday-picker">
                        <span class="wd-label-header">Repeat on:</span>
                        <label class="wd-label"><input type="checkbox" class="wd-check" value="1" /> Mon</label>
                        <label class="wd-label"><input type="checkbox" class="wd-check" value="2" /> Tue</label>
                        <label class="wd-label"><input type="checkbox" class="wd-check" value="3" /> Wed</label>
                        <label class="wd-label"><input type="checkbox" class="wd-check" value="4" /> Thu</label>
                        <label class="wd-label"><input type="checkbox" class="wd-check" value="5" /> Fri</label>
                        <label class="wd-label"><input type="checkbox" class="wd-check" value="6" /> Sat</label>
                        <label class="wd-label"><input type="checkbox" class="wd-check" value="0" /> Sun</label>
                    </div>
                </div>
            </div>
            <div class="add-event-footer">
                <button class="add-event-btn">Add Event</button>
            </div>
        </div>
    </div>
  </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, setDoc, doc } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";
    import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCkKS79ztaGyEDS29mKAgo_3-fnXTfmyro",
        authDomain: "pangolin-f37fa.firebaseapp.com",
        projectId: "pangolin-f37fa",
        storageBucket: "pangolin-f37fa.firebasestorage.app",
        messagingSenderId: "880099895366",
        appId: "1:880099895366:web:edcf2fbdbdc2decbb0c247"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    getRedirectResult(auth).catch(console.error);

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById('login-gate').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            await loadFromFirestore();
            // Refresh calendar after data is loaded from Firestore
            if (typeof window.getEvents === 'function') {
                window.getEvents();
                console.log("Events refreshed from Firestore/localStorage");
            }
            if (typeof window.initCalendar === 'function') {
                window.initCalendar();
                console.log("Calendar re-initialized");
            }
        } else {
            document.getElementById('login-gate').style.display = 'flex';
            document.getElementById('content').style.display = 'none';
        }
    });

    document.getElementById('google-signin-btn').addEventListener('click', () => {
        signInWithRedirect(auth, provider).catch(console.error);
    });

    window.saveToFirestore = async function() {
        const eventsArray = JSON.parse(localStorage.getItem("events") || "[]");
        const eventsObject = {};
        eventsArray.forEach(item => {
            const dateKey = `${item.year}-${String(item.month).padStart(2, '0')}-${String(item.day).padStart(2, '0')}`;
            eventsObject[dateKey] = item.events;
        });
        try {
            await setDoc(doc(db, "calendar0", "calDec"), eventsObject);
            alert("Saved successfully!");
        } catch (error) { console.error(error); }
    };

    async function loadFromFirestore() {
        console.log("Attempting to fetch from Firestore collection: 'calendar0'");
        try {
            const querySnapshot = await getDocs(collection(db, "calendar0"));
            console.log("Firestore response received. Empty:", querySnapshot.empty);

            const eventsArray = [];
            if (querySnapshot.empty) {
                console.warn("No documents found in 'calendar0' collection.");
                return;
            }

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                console.log("Processing document:", doc.id, "Data keys count:", Object.keys(data).length);
                for (const key in data) {
                    const parts = key.split('-');
                    if (parts.length === 3) {
                        const [y, m, d] = parts.map(Number);
                        eventsArray.push({ day: d, month: m, year: y, events: data[key] });
                    }
                }
            });

            if (eventsArray.length > 0) {
                localStorage.setItem("events", JSON.stringify(eventsArray));
                console.log("Success: Saved", eventsArray.length, "days of events to local storage.");
            } else {
                console.log("No valid events found inside the documents.");
            }
        } catch (error) {
            console.error("CRITICAL Firestore load error:", error.code, error.message);
            if (error.code === 'permission-denied') {
                alert("Firestore Error: Permission Denied. Please ensure your Firestore security rules allow 'read' for the 'calendar0' collection.");
            }
        }
    }
</script>
<script src="calendar.js"></script>
</body>
</html>
